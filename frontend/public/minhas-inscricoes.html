<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Inscrições - FGV Conhecimento</title>
<style>
  body{margin:0;background:#f4f6f9;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#1f2933}
  .mi-wrap{max-width:1120px;margin:0 auto;padding:40px 24px 60px}
  .mi-panel{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:36px 40px}
  .mi-title{font-size:20px;font-weight:700;color:#002D4D;margin:0 0 16px;padding:0 0 16px;border-bottom:1px solid #e5e9ef;letter-spacing:.2px}
  .mi-sub{color:#374151;font-size:14px;margin:0 0 20px}
  #mi-card{cursor:pointer;border:1px solid #e2e8f0;border-left:5px solid #003a79;border-radius:12px;box-shadow:0 4px 14px rgba(0,45,77,.08);padding:18px 20px;transition:box-shadow .2s,transform .2s;max-width:820px}
  #mi-card:hover{box-shadow:0 8px 22px rgba(0,45,77,.16);transform:translateY(-2px)}
  .mi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .mi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;font-weight:700}
  .mi-concurso{font-size:15px;font-weight:700;color:#002D4D;margin-bottom:10px}
  .mi-rows{font-size:13px;color:#475569;line-height:1.9}
  .mi-status{background:#fff3cd;color:#8a6d00;font-weight:700;font-size:12px;padding:6px 14px;border-radius:20px;white-space:nowrap}
  .mi-back{margin-top:16px;font-size:12px;color:#003a79;font-weight:600}
  #mi-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:99999;align-items:center;justify-content:center}
  @keyframes miSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body style="visibility:hidden">
<script>setTimeout(function(){document.body.style.visibility='visible';},1500);</script>
<div class="mi-wrap">
  <div class="mi-panel">
    <h1 class="mi-title">MINHAS INSCRIÇÕES</h1>
    <p class="mi-sub">Clique na sua inscrição para ver os detalhes.</p>
    <div id="mi-card" role="button" tabindex="0">
      <div class="mi-top">
        <div>
          <div class="mi-lbl">Concurso</div>
          <div class="mi-concurso" id="mi-concurso">Concurso da Secretaria de Saúde do Estado do Tocantins (SES/TO)</div>
          <div class="mi-rows">
            <strong>Cargo:</strong> <span id="mi-cargo">—</span><br>
            <strong>Nº da inscrição:</strong> <span id="mi-proto">—</span><br>
            <strong>Valor:</strong> <span id="mi-valor">—</span><br>
            <strong>Prazo para pagamento da taxa:</strong> Até 17/09/2026
          </div>
        </div>
        <span class="mi-status">PENDENTE DE PAGAMENTO</span>
      </div>
      <div class="mi-back">&rarr; Clique para ver os detalhes da inscrição</div>
    </div>
  </div>
</div>
<div id="mi-overlay"><div style="width:52px;height:52px;border:5px solid #cfd8e3;border-top-color:#003a79;border-radius:50%;animation:miSpin .8s linear infinite"></div></div>
<script src="/fgv-chrome.js"></script>
<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading')fn(); else document.addEventListener('DOMContentLoaded',fn); }
  ready(function(){
    document.body.style.visibility='visible';
    var d={}; try{ d=JSON.parse(sessionStorage.getItem('inscricao_dados')||'{}'); }catch(e){}
    var cargo=(d.__vaga_label||'—');
    var proto=(d.__protocolo||'—');
    var valor=(d.__taxa || (d.__valor?('R$ '+Number(d.__valor).toFixed(2).replace('.',',')):'—'));
    document.getElementById('mi-cargo').textContent=cargo;
    document.getElementById('mi-proto').textContent=proto;
    document.getElementById('mi-valor').textContent=valor;
    var ov=document.getElementById('mi-overlay');
    function go(){ ov.style.display='flex'; setTimeout(function(){ window.location.href='/inscricao-realizada'; },1000); }
    var card=document.getElementById('mi-card');
    card.addEventListener('click', go);
    card.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
  });
})();
</script>
</body>
</html>

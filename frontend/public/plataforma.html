<script id="__plataforma_logic">
(function(){
  function validaCPF(cpf){cpf=(cpf||'').replace(/\D/g,'');if(cpf.length!==11||/^(\d)\1{10}$/.test(cpf))return false;var s=0,r,i;for(i=0;i<9;i++)s+=parseInt(cpf.charAt(i),10)*(10-i);r=(s*10)%11;if(r===10)r=0;if(r!==parseInt(cpf.charAt(9),10))return false;s=0;for(i=0;i<10;i++)s+=parseInt(cpf.charAt(i),10)*(11-i);r=(s*10)%11;if(r===10)r=0;if(r!==parseInt(cpf.charAt(10),10))return false;return true;}
  function maskCPF(v){v=v.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2');v=v.replace(/(\d{3})(\d)/,'$1.$2');v=v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');return v;}
  function ready(fn){if(document.readyState!=='loading')fn();else document.addEventListener('DOMContentLoaded',fn);}
  ready(function(){
    var cpf=document.getElementById('cpf');
    var pwd=document.getElementById('password');
    var btn=document.getElementById('btn-entrar');
    if(!cpf||!pwd||!btn)return;

    var cpfErr=document.createElement('div');
    cpfErr.id='cpf-error';
    cpfErr.style.cssText='color:#dc3545;font-size:.85rem;margin-top:4px;display:none';
    cpfErr.textContent='CPF inválido';
    cpf.parentNode.insertBefore(cpfErr, cpf.nextSibling);

    var msg=document.createElement('div');
    msg.id='login-msg';
    msg.style.cssText='color:#dc3545;font-size:.92rem;margin-top:12px;display:none;font-weight:600';
    msg.textContent='Usuário não encontrado. Cadastre-se.';
    var row=btn.closest('.d-flex')||btn.parentNode;
    row.parentNode.insertBefore(msg, row.nextSibling);

    function refresh(){
      var ok=validaCPF(cpf.value)&&pwd.value.length>0;
      btn.disabled=!ok;
      btn.style.opacity=ok?'1':'.55';
      btn.style.cursor=ok?'pointer':'not-allowed';
    }
    cpf.addEventListener('input',function(){
      cpf.value=maskCPF(cpf.value);
      var d=cpf.value.replace(/\D/g,'');
      cpfErr.style.display=(d.length===11 && !validaCPF(cpf.value))?'block':'none';
      msg.style.display='none';
      refresh();
    });
    pwd.addEventListener('input',function(){msg.style.display='none';refresh();});
    btn.addEventListener('click',function(){if(btn.disabled)return;var o=document.getElementById('plat-overlay');if(o)o.style.display='flex';setTimeout(function(){if(o)o.style.display='none';msg.style.display='block';},3000);});
    refresh();

    var cad=document.getElementById('btn-cadastrar');
    if(cad){cad.addEventListener('click',function(e){e.preventDefault();var o=document.getElementById('plat-overlay');if(o)o.style.display='flex';setTimeout(function(){window.location.href='/inscricao.html';},1000);});}

    var icon=document.getElementById('password_icon');
    if(icon){
      var tbtn=icon.closest('button');
      var EYE='<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>';
      var SLASH='<path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7.029 7.029 0 0 0 2.79-.588zM5.21 3.088A7.028 7.028 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474L5.21 3.089z"/><path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829l-2.83-2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12-.708.708z"/>';
      icon.innerHTML=EYE;
      if(tbtn){tbtn.setAttribute('type','button');tbtn.addEventListener('click',function(){if(pwd.type==='password'){pwd.type='text';icon.innerHTML=SLASH;}else{pwd.type='password';icon.innerHTML=EYE;}});}
    }
  });
})();
</script>
